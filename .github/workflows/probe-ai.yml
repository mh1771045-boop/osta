name: probe-ai
on:
  push:
    branches: [probe-ai]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Pollinations models
        run: |
          curl -s https://text.pollinations.ai/models -H "Origin: https://mh1771045-boop.github.io" | head -c 3000; echo
      - name: Pollinations fresh Arabic request
        run: |
          n=$RANDOM$RANDOM
          curl -s -i https://text.pollinations.ai/openai -H "Origin: https://mh1771045-boop.github.io" -H "Referer: https://mh1771045-boop.github.io/osta/" -H "Content-Type: application/json" \
            -d "{\"model\":\"openai\",\"messages\":[{\"role\":\"system\",\"content\":\"You are Osta, a coding assistant. Reply in Egyptian Arabic.\"},{\"role\":\"user\",\"content\":\"اكتبلي دالة جافاسكريبت بتجمع رقمين. رقم الطلب $n\"}]}" | head -c 2500; echo
      - name: Pollinations fresh streaming request
        run: |
          n=$RANDOM$RANDOM
          curl -s -N https://text.pollinations.ai/openai -H "Origin: https://mh1771045-boop.github.io" -H "Content-Type: application/json" \
            -d "{\"model\":\"openai\",\"stream\":true,\"messages\":[{\"role\":\"user\",\"content\":\"Count from 1 to 5. id $n\"}]}" | head -c 1500; echo
      - name: Pollinations second fresh request (rate limit check)
        run: |
          n=$RANDOM$RANDOM
          curl -s -i https://text.pollinations.ai/openai -H "Origin: https://mh1771045-boop.github.io" -H "Content-Type: application/json" \
            -d "{\"model\":\"openai\",\"messages\":[{\"role\":\"user\",\"content\":\"Say ok. id $n\"}]}" | head -c 1200; echo
      - name: gen.pollinations.ai
        run: |
          n=$RANDOM$RANDOM
          curl -s -i https://gen.pollinations.ai/v1/chat/completions -H "Origin: https://mh1771045-boop.github.io" -H "Content-Type: application/json" \
            -d "{\"model\":\"openai\",\"messages\":[{\"role\":\"user\",\"content\":\"Say ok. id $n\"}]}" | head -c 1200; echo
