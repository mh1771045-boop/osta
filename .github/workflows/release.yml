name: release

# Push a tag like v0.1.0 (or run this workflow by hand with a version) to build Osta for every
# platform and publish the archives to GitHub Releases, where the installer downloads them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Resolve version
        run: echo "OPENCODE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Build every platform
        working-directory: packages/cli
        # The release notes' Highlights become the "What's new" dialog after an upgrade.
        run: |
          export OPENCODE_RELEASE_NOTES="$(cat "$GITHUB_WORKSPACE/RELEASE_NOTES.md")"
          bun run script/build.ts && rm -rf dist/.bun
        env:
          OPENCODE_CHANNEL: latest
          BUN_COMPILE_RELEASE: bun-v1.4.4
          GH_TOKEN: ${{ github.token }}
      - name: Smoke test
        run: |
          set -e
          bin=packages/cli/dist/cli-linux-x64/bin/osta
          "$bin" --version | tee version.txt
          grep -q "$OPENCODE_VERSION" version.txt
          "$bin" --help | grep -q "Osta command line interface"
      - name: Package
        run: |
          set -e
          mkdir -p release
          for dir in packages/cli/dist/cli-*; do
            name="osta-${dir##*/cli-}"
            if [ -f "$dir/bin/osta.exe" ]; then
              (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/release/$name.zip" bin)
            else
              tar -czf "release/$name.tar.gz" -C "$dir" bin
            fi
          done
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$OPENCODE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Osta $OPENCODE_VERSION" --notes-file RELEASE_NOTES.md
          fi
